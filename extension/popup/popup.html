<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 380px;
      min-height: 500px;
      background: #0a0a0a;
      color: #fafafa;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #6D28D9 0%, #00F0FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 13px;
      color: #888;
    }
    .status {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 8px;
    }
    .status-active {
      color: #00F0FF;
      font-weight: 600;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: center;
    }
    button {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #fafafa;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover {
      background: #2a2a2a;
      border-color: #6D28D9;
    }
    button:active {
      transform: scale(0.95);
    }
    .play-btn {
      background: #6D28D9;
      border: none;
      padding: 14px 24px;
      font-weight: 600;
      flex: 1;
    }
    .play-btn:hover {
      background: #7D38E9;
    }
    .play-btn svg {
      vertical-align: middle;
      margin-right: 4px;
    }
    .spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .settings {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .setting-group {
      margin-bottom: 16px;
    }
    .setting-group:last-child {
      margin-bottom: 0;
    }
    .setting-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
      display: block;
    }
    select, input[type="range"] {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      color: #fafafa;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }
    input[type="range"] {
      accent-color: #6D28D9;
      padding: 0;
      height: 6px;
      cursor: pointer;
    }
    .speed-slider {
      margin-bottom: 8px;
    }
    .speed-marks {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #666;
      padding: 0 2px;
    }
    .setting-select {
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .setting-select:hover {
      border-color: #6D28D9;
    }
    .speed-value {
      float: right;
      color: #6D28D9;
      font-weight: 600;
      min-width: 45px;
      text-align: right;
    }
    .progress {
      text-align: center;
      padding: 12px;
      background: #1a1a1a;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .progress-text {
      font-size: 14px;
      color: #aaa;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6D28D9 0%, #00F0FF 100%);
      width: 0%;
      transition: width 0.3s;
    }
    .chat-btn {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #6D28D9;
      color: #6D28D9;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .chat-btn:hover {
      background: #6D28D9;
      color: #fafafa;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>LexiFlow</h1>
    <p>Documentation Reader</p>
  </div>

  <div class="status" id="status">
    <div class="status-text" id="statusText">Ready to read this page</div>
    <div style="font-size: 11px; color: #666; margin-top: 8px;">
      💡 Tip: Click any text on the page to start from that sentence
    </div>
  </div>

  <div class="progress" id="progress" style="display: none;">
    <div class="progress-text" id="progressText">0 / 0 sentences</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="controls">
    <button id="prevBtn" title="Previous">⏮</button>
    <button class="play-btn" id="playBtn">▶ Start Reading</button>
    <button id="nextBtn" title="Next">⏭</button>
  </div>

  <div class="settings">
    <div class="setting-group">
      <label class="setting-label">TTS Provider</label>
      <select id="ttsProvider" class="setting-select">
        <option value="puter">High Quality TTS ⭐</option>
        <option value="browser">Browser TTS (Offline)</option>
      </select>
    </div>
    
    <div class="setting-group">
      <label class="setting-label">Voice</label>
      <select id="voiceSelect" class="setting-select">
        <option value="">Loading voices...</option>
      </select>
    </div>
    
    <div class="setting-group">
      <label class="setting-label">
        Reading Speed: <span class="speed-value" id="speedValue">1.0x</span>
      </label>
      <input type="range" id="speedSlider" min="0.5" max="2.5" step="0.1" value="1" class="speed-slider">
      <div class="speed-marks">
        <span>0.5x</span>
        <span>1.0x</span>
        <span>1.5x</span>
        <span>2.0x</span>
        <span>2.5x</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
